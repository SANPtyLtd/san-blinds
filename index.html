<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAN Pty Ltd — Blind Job Management</title>
<style>
:root{
  --ink:#16263a; --paper:#eaeef2; --surface:#ffffff; --line:#dbe1e8;
  --teal:#0e7c6b; --teal-d:#0b6558; --text:#1c2b3a; --dim:#657487;
  --amber:#b8791b; --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--paper);font-size:15px;line-height:1.45}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:24px;background:var(--ink);color:#fff;padding:14px 22px;
  border-bottom:3px solid var(--teal)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:26px;height:26px;border-radius:6px;background:
  repeating-linear-gradient(90deg,var(--teal) 0 3px,transparent 3px 6px),var(--teal-d);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.bname{font-weight:700;letter-spacing:.2px;font-size:15px;line-height:1.1}
.btag{font-size:12px;color:#9fb3c8}
.nav{display:flex;gap:4px;margin-left:8px}
.navlink{background:transparent;border:0;color:#c6d4e2;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.navlink:hover{background:rgba(255,255,255,.08);color:#fff}
.navlink.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.topactions{margin-left:auto;display:flex;gap:8px}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:26px;margin:0;letter-spacing:-.3px;color:var(--ink)}
.sub{margin:4px 0 0;color:var(--dim);font-size:14px}
.headctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumbs{margin-bottom:12px}
.link{background:none;border:0;color:var(--teal);cursor:pointer;font-size:14px;padding:4px 0;font-weight:600}
.link:hover{text-decoration:underline}

/* buttons */
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 15px;border-radius:9px;
  cursor:pointer;font-size:14px;font-weight:600;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#c2ccd8;box-shadow:var(--shadow)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#dbe6f0}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.small{padding:6px 11px;font-size:13px}
.btn.disabled{opacity:.5;cursor:not-allowed}
.danger-ghost{color:#b13b3b;border-color:#e6cccc}
.danger-ghost:hover{background:#fbeeee;border-color:#d99}

/* cards + tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:20px}
.cardbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
.grid th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);
  padding:12px 14px;border-bottom:1px solid var(--line);background:#f7f9fb;font-weight:700}
.grid td{padding:11px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.grid tbody tr:last-child td,.grid tbody tr:last-child td{border-bottom:0}
.grid tr:hover td{background:#fafcfd}
.strong{font-weight:700;color:var(--ink)}
.dim{color:var(--dim)}
.rowact{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;
  font-size:15px;line-height:1;padding:8px 9px;color:#8a94a0;transition:.12s}
.iconbtn:hover{border-color:#e6b0b0;background:#fdf3f3;color:#b12a2a}
/* dashboard column sizing (Edit is col 1 on the left).
   Col 2 = SAN Ref (fits 6 mono chars incl. a space, e.g. "S 1001")
   Col 4 = Client (more room)
   Col 5 = Address (shown in full — wraps rather than truncates)
   Col 7 = Expected (compact short-date display) */
.dashgrid th:nth-child(1),.dashgrid td:nth-child(1){width:1%;white-space:nowrap;padding-right:6px}
.dashgrid th:nth-child(2),.dashgrid td:nth-child(2){min-width:104px;white-space:nowrap;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.dashgrid th:nth-child(4),.dashgrid td:nth-child(4){min-width:200px}
.dashgrid td:nth-child(5){white-space:normal;line-height:1.4}
.dashgrid th:nth-child(7),.dashgrid td:nth-child(7){white-space:nowrap}
.dashgrid .actcell{white-space:nowrap}
.dashgrid .rowact{gap:5px;justify-content:center}
.expshow{display:inline-block;font-family:var(--mono);font-size:13px;padding:6px 9px;
  border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fff;white-space:nowrap}
.expshow:hover{border-color:var(--teal);color:var(--teal)}
.expshow.manual{border-color:#d99a2b;background:#fff8e8;color:#8a5a05;font-weight:700}
.expinput.hidden,.expshow.hidden{display:none}
@media (max-width:1024px){
  .iconbtn{padding:9px 10px;font-size:16px}
  .dashgrid th:nth-child(2),.dashgrid td:nth-child(2){min-width:96px}
  .dashgrid th:nth-child(4),.dashgrid td:nth-child(4){min-width:170px}
  .btn.small{padding:9px 12px}
}
td.idx,.idx{color:var(--dim);width:34px;text-align:center;font-family:var(--mono)}
.num{text-align:right}

/* status badges */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.s-grey{background:#eef1f4;color:#516072} .s-blue{background:#e4eefb;color:#215fa6}
.s-amber{background:#fbefd6;color:#996515} .s-orange{background:#fce3d4;color:#b1521f}
.s-slate{background:#e7e9f4;color:#4b4f86} .s-red{background:#fbe0e0;color:#b12a2a}
.s-green{background:#dcf3e4;color:#1d7a45}
select.statussel{border:0;font-weight:700;font-size:12.5px;padding:5px 8px;border-radius:999px;cursor:pointer;appearance:none;-webkit-appearance:none}
select.statussel.s-grey{background:#eef1f4;color:#516072}
select.statussel.s-blue{background:#e4eefb;color:#215fa6}
select.statussel.s-amber{background:#fbefd6;color:#996515}
select.statussel.s-orange{background:#fce3d4;color:#b1521f}
select.statussel.s-slate{background:#e7e9f4;color:#4b4f86}
select.statussel.s-red{background:#fbe0e0;color:#b12a2a}
select.statussel.s-green{background:#dcf3e4;color:#1d7a45}

/* controls */
.search{padding:9px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;width:230px;font-family:inherit}
.search:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.toggle{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--dim);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--teal)}

/* job detail */
.jobhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:6px 0 16px}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px;cursor:pointer;font-size:14.5px;
  color:var(--dim);font-weight:600;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--dim)}
.fld span{font-weight:600}
.fld.wide{margin-top:14px}
.fld input,.fld select,.fld textarea{font-family:inherit;font-size:14.5px;color:var(--text);padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.fld input:disabled{background:#f4f6f8;color:var(--ink);font-weight:600}
.clientcard{margin-top:16px;padding:11px 14px;background:#f4f8f7;border:1px solid #d7e8e4;border-radius:10px;font-size:13.5px;color:#2a5049}

/* entry table */
.entry input,.entry select{width:100%;border:1px solid transparent;background:#fff;padding:8px 9px;border-radius:7px;font-family:inherit;font-size:14px}
.entry input:hover,.entry select:hover{border-color:var(--line)}
.entry input:focus,.entry select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.entry input.num{font-family:var(--mono);text-align:right}
.entryfoot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.count{color:var(--dim);font-size:13px;font-family:var(--mono)}
.hint{color:var(--dim);font-size:13.5px;margin:14px 2px 0}
.ruleline{margin:14px 2px 0;color:var(--dim);font-size:12.5px;font-family:var(--mono)}

/* cut list emphasis */
.cut td.strong,.cut .strong{color:var(--teal-d)}

/* labels preview */
.labelprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.label{border:1px solid var(--ink);border-radius:8px;padding:10px 12px;font-size:12.5px;background:#fff}
.lb-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:6px}
.lb-co{font-weight:800;color:var(--ink)} .lb-addr{font-size:10.5px;color:var(--dim)}
.lb-ref{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:4px}
.lb-blind{display:flex;justify-content:space-between;margin-bottom:6px}
.lb-grid{width:100%;border-collapse:collapse;font-size:12px}
.lb-grid td{border-top:1px solid #eef1f5;padding:4px 3px}
.lb-grid td:first-child{color:var(--dim)}

/* empty states */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:44px;text-align:center;color:var(--dim)}
.empty h3{margin:0 0 6px;color:var(--ink)} .empty.small{padding:26px}
.nomatch{padding:22px;text-align:center;color:var(--dim)}
.foot{max-width:1180px;margin:0 auto;padding:0 22px 40px;color:var(--dim);font-size:12.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(16,28,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.open{display:flex}
.m-card{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.m-title{font-weight:700;font-size:17px;color:var(--ink)}
.m-body{padding:22px}
.m-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.m-close{background:none;border:0;font-size:22px;color:var(--dim);cursor:pointer;line-height:1}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){.formgrid{grid-template-columns:1fr}.top{gap:12px;padding:12px 14px}.btag{display:none}
  .search{width:150px}.wrap{padding:18px 14px 50px}}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  body.printing .app{display:none!important}
  body.printing #printRoot{display:block}
  @page{margin:14mm}
  .p-head h2{margin:0 0 4px;font-size:20px}
  .p-meta{font-size:12px;color:#333;margin-bottom:14px}
  .p-grid{width:100%;border-collapse:collapse;font-size:13px}
  .p-grid th,.p-grid td{border:1px solid #333;padding:7px 9px;text-align:left}
  .p-grid th{background:#eee}
  .p-labels{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
  .p-labels .label{border:1.5px solid #000;page-break-inside:avoid}
}

/* ---- shared-version additions ---- */
.top .who{color:#9fb3c8;font-size:13px;margin-right:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#eef2f6,#e3e9ef)}
.gatecard{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:36px 34px;max-width:400px;width:100%;text-align:center}
.gatecard h1{margin:14px 0 4px;font-size:24px}
.gatecard p{color:var(--dim);font-size:14px;margin:6px 0}
.mark.big{width:46px;height:46px;border-radius:11px;margin:0 auto 4px}
.loginform{margin-top:20px;text-align:left;display:flex;flex-direction:column;gap:13px}
.btn.wide{width:100%;justify-content:center;padding:12px;font-size:15px}
.loginerr{color:#b12a2a;font-size:13px;min-height:15px;text-align:center}
.addholiday{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.addholiday .fld{min-width:150px}
.grid tr.done td{color:#9aa7b4;background:#f7f9fb}
.grid tr.done .strong{color:#9aa7b4;font-weight:600}
.grid tr.done .mono{color:#aab4bf}
.grid tr.done .statussel{opacity:.7}
.grid tr.done:hover td{background:#eef2f6}
.cfg{text-align:left;background:#f4f7fa;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#3c4a5a;overflow-x:auto;margin:14px 0 6px}
.linkbox{width:100%;font-family:var(--mono);font-size:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;background:#f7f9fb;color:#3c4a5a;margin:4px 0 12px}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.tiny{font-size:12px;margin:12px 0 0}
.modes{display:inline-flex;background:#eef2f6;border-radius:10px;padding:3px;margin-bottom:16px}
.modebtn{border:0;background:transparent;padding:7px 15px;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:600;color:var(--dim)}
.modebtn.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,32,48,.12)}
.quotegrid td{vertical-align:middle}
.quotegrid .ticks{white-space:nowrap}
.tick{display:inline-flex;align-items:center;gap:5px;margin-right:11px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.tick input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer}
.qtotal{text-align:right;white-space:nowrap}
.qprice{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:14.5px}
.qwarn{color:#b12a2a;font-size:12.5px;font-weight:600}
.qwarn2{color:#b12a2a;font-size:13px;margin:12px 0 0}
.qband{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.ralign{text-align:right}
.totals{margin-top:16px}
.installtog{margin-bottom:14px}
.ttable{width:100%;max-width:340px;margin-left:auto;border-collapse:collapse;font-size:14px}
.ttable td{padding:6px 0}
.ttable td:last-child{text-align:right;font-weight:600}
.ttable .tsub td{border-top:1px solid var(--line);padding-top:10px}
.ttable .tgrand td{border-top:2px solid var(--ink);padding-top:10px;font-size:17px;font-weight:800;color:var(--ink)}
@media print{
  .p-quote .p-grid .ra,.p-quote .p-tot .ra{text-align:right}
  .p-tot{width:auto;margin:16px 0 0 auto;border-collapse:collapse;font-size:13px}
  .p-tot td{padding:5px 10px}
  .p-tot .sub td{border-top:1px solid #333}
  .p-tot .grand td{border-top:2px solid #000;font-weight:800;font-size:15px}
  .p-foot{margin-top:26px;font-size:11px;color:#444;line-height:1.6}
}
.ordcell{white-space:nowrap}
.orddate{margin-left:8px;font-family:var(--mono);font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:7px}
.grid tr.ordered td{background:#f3faf6}
.togrow{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
.ordbar{display:flex;align-items:flex-end;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.fld.inline{flex-direction:column;gap:5px}
.exgst{color:var(--dim);font-size:12px;text-align:right;padding-top:2px}
@media print{
  .qgrid .sz{text-align:right;font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}
  .qgrid .ct{text-align:center;width:22px}
  .qgrid .wname{font-weight:700}
  .qgrid th{font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .exg{text-align:right;color:#555;font-size:11px}
  .fabsec{margin-top:26px;page-break-inside:avoid}
  .fabsec h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px}
  .fabbox{border:1px solid #333;padding:10px 12px;font-size:12.5px;min-height:52px;line-height:1.6}
  .fablines div{border-bottom:1px solid #888;height:22px}
}
.quotegrid th:nth-child(3),.quotegrid td:nth-child(3){min-width:270px}
.quotegrid td:nth-child(3) select{width:100%;min-width:24ch}
.quotegrid th:nth-child(4),.quotegrid td:nth-child(4),
.quotegrid th:nth-child(5),.quotegrid td:nth-child(5){min-width:120px}
.quotegrid td input.num{font-size:15.5px;padding:9px 11px;letter-spacing:.4px}
/* no up/down spinners on measurement fields — they invite mis-clicks */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.chip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.chip.saving{background:rgba(255,255,255,.14);color:#cfe0ee}
.chip.saved{background:rgba(60,200,140,.18);color:#8ff0c4}
#savechip:empty{display:none}
/* ---- quote grid: one line when there's room, folds when there isn't ---- */
.quotegrid tr.qsub{display:none}
.quotegrid tr.qsub td{border-top:0;padding-top:0;padding-bottom:12px}
.quotegrid tr.qmain td{border-bottom:0;padding-bottom:8px}
.subline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.subitem{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap}
.sublabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:700}
.subitem select{min-width:22ch;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:15px;background:#fff}

/* Tablet landscape (about 901-1250px): keep everything on ONE line by
   tightening the columns — this is the iPad landscape case. */
@media (min-width:901px) and (max-width:1250px){
  .wrap{padding:22px 14px 50px}
  .quotegrid td,.quotegrid th{padding-left:6px;padding-right:6px}
  .quotegrid th:nth-child(3),.quotegrid td:nth-child(3){min-width:180px}
  .quotegrid td:nth-child(3) select{min-width:0}
  .quotegrid th:nth-child(4),.quotegrid td:nth-child(4),
  .quotegrid th:nth-child(5),.quotegrid td:nth-child(5){min-width:100px}
  .quotegrid td input.num{font-size:16px;padding:10px 8px}
  .quotegrid input,.quotegrid select{font-size:16px;min-height:44px}
  .quotegrid tr.qmain td{border-bottom:1px solid #eef1f5;padding-bottom:11px}
}

/* Narrow screens (phones, iPad portrait): fold type + extras underneath */
@media (max-width:900px){
  .wrap{padding:20px 12px 50px}
  .quotegrid .celltype,.quotegrid .inlineticks,
  .quotegrid .hdr-type,.quotegrid .hdr-extras{display:none}
  .quotegrid tr.qsub{display:table-row}
  .quotegrid tr.qmain td{border-bottom:0}
  .quotegrid th:nth-child(3),.quotegrid td:nth-child(3){min-width:0}
  .quotegrid input,.quotegrid select,.subitem select{font-size:16px;min-height:44px}
  .quotegrid td input.num{font-size:17px}
  .quotegrid th:nth-child(4),.quotegrid td:nth-child(4),
  .quotegrid th:nth-child(5),.quotegrid td:nth-child(5){min-width:104px}
}

/* Comfortable tap targets on any touch device */
@media (max-width:1250px){
  .btn{padding:10px 15px}
  .btn.small{padding:9px 12px}
  .qprice{font-size:16px}

.pricegrid .rowhd{background:#f7f9fb}

  /* ---------- helpers ---------- */
  function uid() {
    if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();

  }
  function localISO(d) {
    var p = function (x) { return (x < 10 ? "0" : "") + x; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function todayISO() { return localISO(new Date()); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {

    });
  }

  function clothWidth(fr, w) {
    w = num(w); if (w === null) return null;
    if (fr === "Face / Make") return w - 26;

    return null;
  }
  function clothDrop(d) { d = num(d); return d === null ? null : d + 250; }
  function tubeLength(fr, w) { return clothWidth(fr, w); }

  function rebuildHolidaySet() {

  }

    if (!iso) return null;

    var added = 0;
    while (added < n) {
      d.setDate(d.getDate() + 1);
      var day = d.getDay();
      if (day !== 0 && day !== 6 && !holidaySet[localISO(d)]) added++;

    return d.getDate() + " " + mon[d.getMonth()] + " " + String(d.getFullYear()).slice(2);
  }

    if (!d) return "";
    if (typeof d === "string") { d = new Date(d + "T00:00:00"); if (isNaN(d)) return ""; }

    return {

      jobAddress: r.job_address || "", dateReceived: r.date_received || "",

  };

  function noteBadge(j) {

      return '<span class="notebadge nonote" title="No client note on this job">\u2709</span>';
    }
    var when = noteDateText(j.clientNoteAt);
    var tip = "Client note" + (when ? " (added " + when + ")" : "") + ":\n" + note;
    return '<span class="notebadge on" tabindex="0" title="' + esc(tip) + '">' +

  async function loadAll() {
    var res = await Promise.all([
      db.from("clients").select("*").order("name"),
      db.from("jobs").select("*").order("created_at", { ascending: false }),
      db.from("holidays").select("*").order("day"),
      db.from("quotes").select("*").order("created_at", { ascending: false }),
      db.from("price_lists").select("*").order("created_at", { ascending: false }),
      db.from("quote_access").select("email")
    ]);
    if (res[0].error || res[1].error || res[2].error) {
      throw (res[0].error || res[1].error || res[2].error);
    }
    clients = res[0].data || [];
    jobs = (res[1].data || []).map(toApp);
    holidays = res[2].data || [];

    quotes = (res[3] && !res[3].error) ? (res[3].data || []).map(toAppQuote) : [];
    if (res[3] && res[3].error) quotesReady = false; else quotesReady = true;
    /* price_lists table is optional until prices.sql has been run */
    priceLists = (res[4] && !res[4].error) ? (res[4].data || []) : [];
    pricesReady = !!(res[4] && !res[4].error);
    /* quote_access is optional until quote-access.sql has been run */
    if (res[5] && !res[5].error) {

  function bandUp(list, v) {
    for (var i = 0; i < list.length; i++) if (list[i] >= v) return list[i];
    return null;
  }
  /* Returns { price, wBand, dBand } or { error } */
  function blindPrice(P, group, width, drop) {
    var t = groupOf(P, group);
    if (!t) return { error: "Pick a blind type" };
    var w = Number(width), d = Number(drop);
    if (!isFinite(w) || w <= 0 || !isFinite(d) || d <= 0) return { error: "" };
    var wB = bandUp(t.widths, w), dB = bandUp(t.drops, d);
    if (wB === null || dB === null) return { error: "Over size — check with office" };
    var row = t.rows[dB];
    var idx = t.widths.indexOf(wB);
    if (!row || idx < 0 || typeof row[idx] !== "number") return { error: "No price listed" };
    return { price: row[idx], wBand: wB, dBand: dB };
  }
  function addonTotal(P, w) {
    var t = 0;
    P.addons.forEach(function (a) { if (w[a.key]) t += a.price; });
    return t;
  }
  function quoteLines(q) {
    var P = pricingForQuote(q);
    return (q.windows || []).map(function (w) {
      var r = blindPrice(P, w.group, w.width, w.drop);
      var counts = typeof r.price === "number";
      var blind = counts ? r.price : 0;
      var addons = addonTotal(P, w);
      var install = q.install ? P.install : 0;
      return { w: w, res: r, blind: blind, addons: addons, install: install,
               total: counts ? blind + addons + install : 0, counts: counts };
    });
  }
  function motorOf(P, key) {
    var list = P.motors || [];
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }
  function motorLines(q) {
    var P = pricingForQuote(q);
    return (q.motorisation || []).map(function (m) {
      var item = motorOf(P, m.key);
      var qty = Math.max(1, parseInt(m.qty, 10) || 1);
      var priced = !!(item && typeof item.price === "number");
      return { row: m, item: item, qty: qty, unit: priced ? item.price : null,
               total: priced ? item.price * qty : 0, priced: priced };
    });
  }
  function motorTotal(q) {
    var t = 0;
    motorLines(q).forEach(function (L) { if (L.priced) t += L.total; });
    return t;
  }
  function motorUnpriced(q) {
    var n = 0;
    motorLines(q).forEach(function (L) { if (L.row.key && !L.priced) n++; });
    return n;
  }

  function fabricOf(P, key) {
    var list = P.fabrics || [];
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i];
    return null;
  }
  function curtainLines(q) {
    var P = pricingForQuote(q);
    return (q.curtains || []).map(function (c) {
      var f = fabricOf(P, c.fabric);
      var mm = Number(c.width);
      var metres = (isFinite(mm) && mm > 0) ? mm / 1000 : 0;
      var rated = !!(f && typeof f.rate === "number");
      var priced = rated && metres > 0;
      return { row: c, fab: f, metres: metres, rate: rated ? f.rate : null,
               total: priced ? Math.round(f.rate * metres * 100) / 100 : 0, priced: priced };
    });
  }
  function curtainTotal(q) {
    var t = 0;
    curtainLines(q).forEach(function (L) { if (L.priced) t += L.total; });
    return Math.round(t * 100) / 100;
  }
  function curtainIncomplete(q) {
    var n = 0;
    curtainLines(q).forEach(function (L) {
      if ((L.row.fabric || L.row.width || L.row.name) && !L.priced) n++;
    });
    return n;
  }

  function quoteTotals(q) {
    var P = pricingForQuote(q);
    var t = { blinds: 0, addons: 0, install: 0, motors: 0, motorUnpriced: 0, curtains: 0, curtainIncomplete: 0,
              qty: 0, sub: 0, gst: 0, total: 0, unpriced: 0 };
    quoteLines(q).forEach(function (L) {
      if (L.counts) { t.blinds += L.blind; t.addons += L.addons; t.install += L.install; t.qty++; }
      else if (L.w.width || L.w.drop || L.w.name) t.unpriced++;
    });
    t.motors = motorTotal(q);
    t.motorUnpriced = motorUnpriced(q);
    t.curtains = curtainTotal(q);
    t.curtainIncomplete = curtainIncomplete(q);
    t.sub = t.blinds + t.addons + t.install + t.motors + t.curtains;
    t.gst = q.gst ? Math.round(t.sub * P.gstRate * 100) / 100 : 0;
    t.total = Math.round((t.sub + t.gst) * 100) / 100;
    return t;
  }

      ordered: false, fabric_notes: "", windows: [blankQuoteWindow()], motorisation: [], curtains: [],

  /* ---- price editing actions ---- */
  function priceInput(el) {
    var P = pd(), v = el.value;
    if (el.hasAttribute("data-pset")) {
      if (el.getAttribute("data-pset") === "install") P.install = Number(v) || 0;
      else P.gstRate = (Number(v) || 0) / 100;
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pg")) { P.groups[+el.getAttribute("data-pg")].label = v; markDirty(); return true; }
    if (el.hasAttribute("data-pfab")) {
      var ff = P.fabrics[+el.getAttribute("data-pfab")], ffld = el.getAttribute("data-pf");
      if (ffld === "rate") ff.rate = (String(v).trim() === "") ? null : (Number(v) || 0);
      else ff[ffld] = v;
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pm")) {
      var mm = P.motors[+el.getAttribute("data-pm")], mf = el.getAttribute("data-pf");
      if (mf === "price") mm.price = (String(v).trim() === "") ? null : (Number(v) || 0);
      else mm[mf] = v;
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pa")) {
      var a = P.addons[+el.getAttribute("data-pa")], f = el.getAttribute("data-pf");
      a[f] = (f === "price") ? (Number(v) || 0) : v;
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pw")) {
      var g1 = P.groups[+el.getAttribute("data-pw")];
      g1.widths[+el.getAttribute("data-wi")] = Number(v) || 0;
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pd")) {
      var g2 = P.groups[+el.getAttribute("data-pd")], di = +el.getAttribute("data-di");
      var oldD = g2.drops[di], newD = Number(v) || 0;
      if (oldD !== newD) {
        var rowVals = g2.rows[oldD];
        delete g2.rows[oldD];
        g2.drops[di] = newD;
        g2.rows[newD] = rowVals;
      }
      markDirty(); return true;
    }
    if (el.hasAttribute("data-pc")) {
      var g3 = P.groups[+el.getAttribute("data-pc")];
      var d3 = g3.drops[+el.getAttribute("data-di")];
      if (!g3.rows[d3]) g3.rows[d3] = [];
      g3.rows[d3][+el.getAttribute("data-wi")] = (String(v).trim() === "") ? null : (Number(v) || 0);
      markDirty(); return true;
    }
    return false;
  }

  function priceClick(t) {
    var P = pd(), m;
    if (t.hasAttribute("data-width-add")) {
      var g = P.groups[+t.getAttribute("data-width-add")];
      var last = g.widths[g.widths.length - 1] || 0;
      g.widths.push(last + 300);
      g.drops.forEach(function (d) { (g.rows[d] = g.rows[d] || []).push(null); });
      markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-width-del")) {
      var g2 = P.groups[+t.getAttribute("data-width-del")];
      if (g2.widths.length <= 1) { toast("A grid needs at least one width."); return true; }
      g2.widths.pop();
      g2.drops.forEach(function (d) { if (g2.rows[d]) g2.rows[d].pop(); });
      markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-drop-add")) {
      var g3 = P.groups[+t.getAttribute("data-drop-add")];
      var lastD = g3.drops[g3.drops.length - 1] || 0;
      var nd = lastD + 300;
      g3.drops.push(nd);
      g3.rows[nd] = g3.widths.map(function () { return null; });
      markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-drop-del")) {
      m = t.getAttribute("data-drop-del").split("_");
      var g4 = P.groups[+m[0]], di = +m[1];
      if (g4.drops.length <= 1) { toast("A grid needs at least one drop."); return true; }
      var dv = g4.drops[di];
      if (!confirm("Remove the " + dv + " mm drop row?")) return true;
      g4.drops.splice(di, 1); delete g4.rows[dv];
      markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-group-del")) {
      var gi = +t.getAttribute("data-group-del");
      if (P.groups.length <= 1) { toast("Keep at least one blind type."); return true; }
      if (!confirm('Remove "' + P.groups[gi].label + '"?\n\nQuotes already written keep their prices, but you will not be able to pick this type on new ones.')) return true;
      P.groups.splice(gi, 1); markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-fabric-del")) {
      P.fabrics.splice(+t.getAttribute("data-fabric-del"), 1); markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-motor-del")) {
      P.motors.splice(+t.getAttribute("data-motor-del"), 1); markDirty(); render(); return true;
    }
    if (t.hasAttribute("data-addon-del")) {
      P.addons.splice(+t.getAttribute("data-addon-del"), 1); markDirty(); render(); return true;
    }
    return false;
  }

  function weekdaysBetween(fromISO, toISO) {
    var out = [], d = new Date(fromISO + "T00:00:00"), end = new Date(toISO + "T00:00:00"), guard = 0;
    if (isNaN(d) || isNaN(end)) return out;
    while (d <= end && guard++ < 400) {
      var g = d.getDay();
      if (g !== 0 && g !== 6) out.push(localISO(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ""; }

  async function addHoliday() {
    var mode = state.holidayMode === "range" ? "range" : "single";
    var nm = val("h-name");
    var wanted = [];

    if (mode === "single") {
      var d = val("h-date");
      if (!d) { toast("Pick a date first."); return; }
      wanted = [d];
    } else {
      var from = val("h-from"), to = val("h-to");
      if (!from || !to) { toast("Pick both a first and last day."); return; }
      if (to < from) { toast("The last day is before the first day."); return; }
      wanted = weekdaysBetween(from, to);
      if (!wanted.length) { toast("That range is all weekend — nothing to add."); return; }
      if (wanted.length > 60) { toast("That range is very long. Please keep it under 60 weekdays."); return; }
    }

    var have = {};
    holidays.forEach(function (h) { have[h.day] = true; });
    var fresh = wanted.filter(function (d) { return !have[d]; });
    var already = wanted.length - fresh.length;
    if (!fresh.length) { toast("Those dates are already in the list."); return; }

    var r = await db.from("holidays")
      .insert(fresh.map(function (d) { return { day: d, name: nm }; }))
      .select();
    if (r.error) { toast("Could not add those dates."); return; }

    holidays = holidays.concat(r.data || []);
    holidays.sort(function (a, b) { return a.day < b.day ? -1 : 1; });
    rebuildHolidaySet(); render();
    toast(fresh.length + " date" + (fresh.length === 1 ? "" : "s") + " added" +
      (already ? " (" + already + " already there)" : "") + ".");
  }
  async function deleteHolidayGroup(name) {
    var group = holidays.filter(function (h) { return (h.name || "").trim() === name; });
    if (!group.length) return;
    if (!confirm("Remove all " + group.length + " dates named \u201c" + name + "\u201d?")) return;
    var r = await db.from("holidays").delete().eq("name", name);
    if (r.error) { toast("Could not remove those dates."); return; }
    holidays = holidays.filter(function (h) { return (h.name || "").trim() !== name; });
    rebuildHolidaySet(); render();
    toast(group.length + " dates removed.");
  }

  }

      "[data-edit-client],[data-del-client],[data-del-win],[data-del-holiday]," +

      "[data-edit-quote],[data-del-quote],[data-qtoggle],[data-exp-clear]," +
      "[data-width-add],[data-width-del],[data-drop-add],[data-drop-del]," +
      "[data-group-del],[data-addon-del],[data-mo-del],[data-motor-del]," +
      "[data-cu-del],[data-fabric-del],[data-qauthor],[data-fav-client],.m-close,[data-msave]");

    if (priceClick(t)) return;

    else if (t.hasAttribute("data-newtoken")) regenerateToken(t.getAttribute("data-newtoken"));
    else if (t.hasAttribute("data-edit-client")) editClientDialog(t.getAttribute("data-edit-client"));
    else if (t.hasAttribute("data-del-job")) deleteJob(t.getAttribute("data-del-job"));
    else if (t.hasAttribute("data-exp-clear")) setExpectedOverride(t.getAttribute("data-exp-clear"), "");

      var cell = t.parentNode;

    else if (t.hasAttribute("data-del-holiday")) deleteHoliday(t.getAttribute("data-del-holiday"));
    else if (t.hasAttribute("data-del-hgroup")) deleteHolidayGroup(t.getAttribute("data-del-hgroup"));
    else if (t.hasAttribute("data-qtoggle")) {
      var qt = getQuote(state.quoteId);
      if (qt) {
        var tw = qt.windows.filter(function (x) { return x.id === t.getAttribute("data-qtoggle"); })[0];
        if (tw) {
          var tk = t.getAttribute("data-qf");
          tw[tk] = !tw[tk];
          queueQuotePatch(qt.id, "windows", qt.windows);

        }
      }
    }
    else if (t.hasAttribute("data-qauthor")) { state.quoteAuthor = t.getAttribute("data-qauthor"); render(); }
    else if (t.hasAttribute("data-edit-quote")) { state.view = "quote"; state.quoteId = t.getAttribute("data-edit-quote"); render(); }
    else if (t.hasAttribute("data-del-quote")) deleteQuote(t.getAttribute("data-del-quote"));
    else if (t.hasAttribute("data-cu-del")) {
      var qc2 = getQuote(state.quoteId);
      if (qc2) {
        qc2.curtains = (qc2.curtains || []).filter(function (x) { return x.id !== t.getAttribute("data-cu-del"); });
        queueQuotePatch(qc2.id, "curtains", qc2.curtains); render();
      }
    }
    else if (t.hasAttribute("data-mo-del")) {
      var qm = getQuote(state.quoteId);
      if (qm) {
        qm.motorisation = (qm.motorisation || []).filter(function (x) { return x.id !== t.getAttribute("data-mo-del"); });
        queueQuotePatch(qm.id, "motorisation", qm.motorisation); render();
      }

    else if (t.hasAttribute("data-del-qw")) {
      var qq = getQuote(state.quoteId);
      if (qq) {
        qq.windows = qq.windows.filter(function (x) { return x.id !== t.getAttribute("data-del-qw"); });
        if (!qq.windows.length) qq.windows.push(blankQuoteWindow());

    else if (t.hasAttribute("data-msave")) { if (modalSave) modalSave(); closeModal(); }

      else if (a === "clientview") { state.clientView = t.checked; render(); }

      else if (a === "print-cloth") printCloth(getJob(state.jobId));

      else if (a === "price-revert") revertPrices();
      else if (a === "price-newlist") newPriceList();
      else if (a === "addon-add") addAddon();
      else if (a === "group-add") addGroup();
      else if (a === "add-motor") {
        var qam = getQuote(state.quoteId);
        if (qam) {
          qam.motorisation = qam.motorisation || [];
          qam.motorisation.push({ id: uid(), key: "", qty: 1 });
          queueQuotePatch(qam.id, "motorisation", qam.motorisation); render();
        }
      }
      else if (a === "add-curtain") {
        var qac = getQuote(state.quoteId);
        if (qac) {
          qac.curtains = qac.curtains || [];
          qac.curtains.push({ id: uid(), name: "", fabric: "", width: "" });
          queueQuotePatch(qac.id, "curtains", qac.curtains); render();
        }
      }
      else if (a === "fabric-add") addFabric();
      else if (a === "motor-add") addMotorItem();
      else if (a === "new-quote") newQuote();
      else if (a === "add-qw") {
        var qa = getQuote(state.quoteId);
        if (qa && qa.windows.length < MAX_QUOTE_WINDOWS) {
          qa.windows.push(blankQuoteWindow()); queueQuotePatch(qa.id, "windows", qa.windows); render();
        }
      }
      else if (a === "q-install") { var qi = getQuote(state.quoteId); if (qi) { setQuoteField(qi, "install", t.checked); render(); } }
      else if (a === "q-gst") { var qg = getQuote(state.quoteId); if (qg) { setQuoteField(qg, "gst", t.checked); render(); } }
      else if (a === "print-quote") { var qp = getQuote(state.quoteId); if (qp) printQuote(qp); }
      else if (a === "hmode-single") { state.holidayMode = "single"; render(); }
      else if (a === "hmode-range") { state.holidayMode = "range"; render(); }
      else if (a === "export") exportData();
      else if (a === "login") doLogin();
      else if (a === "signout") doSignOut();
    }
  });

  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-search")) { state.search = el.value; renderDashboardKeepFocus(); return; }
    if (state.view === "prices" && priceInput(el)) {
      var chip = document.querySelector(".warnchip");
      if (!chip) { var hc = document.querySelector(".headctrls"); if (hc && priceDirty) render(); }
      return;
    }
    if (el.hasAttribute("data-qsearch")) { state.quoteSearch = el.value; renderQuotesKeepFocus(); return; }
    if (el.hasAttribute("data-q-field")) {
      var qf = getQuote(state.quoteId);
      if (qf) setQuoteField(qf, el.getAttribute("data-q-field"), el.value);
      return;
    }
    if (el.hasAttribute("data-cu")) {
      var qcu = getQuote(state.quoteId); if (!qcu) return;
      var cr = (qcu.curtains || []).filter(function (x) { return x.id === el.getAttribute("data-cu"); })[0];
      if (cr) {
        cr[el.getAttribute("data-cf2")] = el.value;
        queueQuotePatch(qcu.id, "curtains", qcu.curtains);
        refreshQuoteLive(qcu);
      }
      return;
    }
    if (el.hasAttribute("data-mo")) {
      var qmo = getQuote(state.quoteId); if (!qmo) return;
      var mr = (qmo.motorisation || []).filter(function (x) { return x.id === el.getAttribute("data-mo"); })[0];
      if (mr) {
        mr[el.getAttribute("data-mf")] = el.value;
        queueQuotePatch(qmo.id, "motorisation", qmo.motorisation);
        refreshQuoteLive(qmo);
      }
      return;
    }
    if (el.hasAttribute("data-qw")) {
      var qe = getQuote(state.quoteId); if (!qe) return;
      var qw = qe.windows.filter(function (x) { return x.id === el.getAttribute("data-qw"); })[0];
      if (qw) {
        var f = el.getAttribute("data-qf");
        qw[f] = el.value;
        queueQuotePatch(qe.id, "windows", qe.windows);
        refreshQuoteLive(qe);
      }
      return;
    }
    var job = getJob(state.jobId); if (!job) return;
    if (el.hasAttribute("data-job-field") && el.getAttribute("data-job-field") === "clientNote") {
      var jN = getJob(state.jobId);
      if (jN) { noteChanged(jN, el.value); jN.clientNote = el.value; queueJobPatch(jN.id, "client_note", el.value); }
      return;
    }
    if (el.hasAttribute("data-job-field")) {
      var f = el.getAttribute("data-job-field"); job[f] = el.value; if (FIELD_COL[f]) queueJobPatch(job.id, FIELD_COL[f], el.value);
    } else if (el.hasAttribute("data-win")) {
      var w = job.windows.filter(function (x) { return x.id === el.getAttribute("data-win"); })[0];
      if (w) { w[el.getAttribute("data-wf")] = el.value; saveWindows(job); }
    }
  });

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.hasAttribute("data-exp-job")) { setExpectedOverride(el.getAttribute("data-exp-job"), el.value); return; }
    if (el.hasAttribute("data-exp-show")) { return; }
    if (el.hasAttribute("data-status-job")) {
      var j = getJob(el.getAttribute("data-status-job")); if (j) { j.status = el.value; queueJobPatch(j.id, "status", el.value); render(); } return;
    }
    if (el.hasAttribute("data-q-ordered")) { setOrdered(el.getAttribute("data-q-ordered"), el.checked); return; }
    if (el.hasAttribute("data-q-orddate")) {
      var qo = getQuote(el.getAttribute("data-q-orddate"));
      if (qo) { qo.orderedDate = el.value; queueQuotePatch(qo.id, "ordered_date", el.value); }
      return;
    }
    if (el.hasAttribute("data-q-client")) {
      var qc = getQuote(state.quoteId);
      if (qc) { setQuoteField(qc, "clientId", el.value || null); render(); }
      return;
    }
    if (el.getAttribute("data-q-field") === "date") {
      var qd = getQuote(state.quoteId);
      if (qd) { setQuoteField(qd, "date", el.value); render(); }
      return;
    }
    if (el.getAttribute("data-q-field") === "createdBy") {
      var qb = getQuote(state.quoteId);
      if (qb) { setQuoteField(qb, "createdBy", el.value); render(); }
      return;
    }
    if (el.hasAttribute("data-cu")) {
      var qcu2 = getQuote(state.quoteId); if (!qcu2) return;
      var cr2 = (qcu2.curtains || []).filter(function (x) { return x.id === el.getAttribute("data-cu"); })[0];
      if (cr2) {
        cr2[el.getAttribute("data-cf2")] = el.value;
        queueQuotePatch(qcu2.id, "curtains", qcu2.curtains); render();
      }
      return;
    }
    if (el.hasAttribute("data-mo")) {
      var qmo2 = getQuote(state.quoteId); if (!qmo2) return;
      var mr2 = (qmo2.motorisation || []).filter(function (x) { return x.id === el.getAttribute("data-mo"); })[0];
      if (mr2) {
        mr2[el.getAttribute("data-mf")] = el.value;
        queueQuotePatch(qmo2.id, "motorisation", qmo2.motorisation); render();
      }
      return;
    }
    if (el.hasAttribute("data-qw")) {
      var qe2 = getQuote(state.quoteId); if (!qe2) return;
      var qw2 = qe2.windows.filter(function (x) { return x.id === el.getAttribute("data-qw"); })[0];
      if (qw2) {
        var cf = el.getAttribute("data-qf");
        qw2[cf] = (el.type === "checkbox") ? el.checked : el.value;
        queueQuotePatch(qe2.id, "windows", qe2.windows);
        /* width/drop update in place so the caret is never disturbed */
        if (cf === "width" || cf === "drop") refreshQuoteLive(qe2); else render();
      }
      return;
    }
    var job = getJob(state.jobId); if (!job) return;
    if (el.hasAttribute("data-job-client")) { job.clientId = el.value || null; queueJobPatch(job.id, "client_id", job.clientId); render(); }
    else if (el.getAttribute("data-job-field") === "status") { job.status = el.value; queueJobPatch(job.id, "status", el.value); render(); }
    else if (el.getAttribute("data-job-field") === "dateReceived") { job.dateReceived = el.value; queueJobPatch(job.id, "date_received", el.value); render(); }
    else if (el.hasAttribute("data-win") && el.getAttribute("data-wf") === "faceRec") {
      var w = job.windows.filter(function (x) { return x.id === el.getAttribute("data-win"); })[0];
      if (w) { w.faceRec = el.value; saveWindows(job); }
    }
  });

  /* A stray scroll over a focused number field must not change a size */
  document.addEventListener("wheel", function (e) {
    var el = e.target;
    if (el && el.tagName === "INPUT" && el.type === "number" && document.activeElement === el) el.blur();
  }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && document.getElementById("li-pass") && !document.getElementById("modal").classList.contains("open")) {
      var lp = document.getElementById("li-pass"); if (document.activeElement === lp || document.activeElement === document.getElementById("li-email")) doLogin();
    }
  });

  function renderQuotesKeepFocus() {
    var val = state.quoteSearch; render();
    var s2 = document.querySelector("[data-qsearch]");
    if (s2) { s2.focus(); s2.value = val; try { s2.setSelectionRange(val.length, val.length); } catch (e) {} }
  }
  function renderDashboardKeepFocus() {
    var val = state.search; render();
    var s = document.querySelector("[data-search]");
    if (s) { s.focus(); s.value = val; s.setSelectionRange(val.length, val.length); }
  }

  /* ---------- boot ---------- */
  async function initAfterLogin(session) {
    user = session.user;
    if (!booted) {
      booted = true;
      try { await loadAll(); } catch (e) { toast("Could not load data — check the database is set up."); }
      setupRealtime();
    }
    state.view = "dashboard"; render();
  }
  function boot() {
    app = document.getElementById("app");
    if (!configured()) { render(); return; }
    var lib = window.supabase;
    if (!lib || !lib.createClient) { app.innerHTML = '<div class="gate"><div class="gatecard"><h1>Offline</h1><p>Could not load the database library. Check the internet connection and refresh.</p></div></div>'; return; }
    db = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
    db.auth.getSession().then(function (r) {
      if (r.data && r.data.session) initAfterLogin(r.data.session); else { user = null; render(); }
    });
    db.auth.onAuthStateChange(function (event, session) {
      if (session) initAfterLogin(session);
      else { user = null; booted = false; render(); }
    });
  }
  if (document.readyState !== "loading") boot();
  else document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
